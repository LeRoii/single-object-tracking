# RK3566 interactive Debug profile. Relative paths use this file's directory.
video=../data/girl_dance.mp4
model_dir=../models
interactive=true
sensor=visible
controller_config=visible-default.conf

# VisDrone9 detector candidate for Debug validation; this is not a promotion.
detector_model=../releases/yolov8n-visdrone9-rk3566-fp16-v1/models/yolov8n-visdrone9-rk3566-fp16.rknn
detector_manifest=../releases/yolov8n-visdrone9-rk3566-fp16-v1/models/detector-manifest.json
detector_labels=../releases/yolov8n-visdrone9-rk3566-fp16-v1/models/visdrone9.txt
detector_class_id=-1
detector_conf=0.25
detector_nms=0.45

# Automatic class matching defaults are uncalibrated Debug values.
target_class_min_roi_coverage=0.50
target_class_max_center_ratio=0.60
target_class_ambiguity_margin=0.10

# Output paths are intentionally omitted. Interactive Debug saves nothing by
# default. Add output_video, output_boxes, or session_metadata when required.
