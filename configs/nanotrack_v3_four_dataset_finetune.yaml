META_ARC: "nanotrack-four-dataset-finetune"

BACKBONE:
    TYPE: "mobilenetv3_small_v3"
    KWARGS:
        used_layers: [4]
    PRETRAINED: ""
    TRAIN_LAYERS: ["features"]
    TRAIN_EPOCH: 3
    LAYERS_LR: 0.02

ADJUST:
    ADJUST: True
    TYPE: "AdjustLayer"
    KWARGS:
        in_channels: 96
        out_channels: 96

BAN:
    BAN: True
    TYPE: "DepthwiseBAN"
    KWARGS:
        in_channels: 96
        out_channels: 96

CUDA: True

POINT:
    STRIDE: 16

TRACK:
    TYPE: "NanoTracker"
    WINDOW_INFLUENCE: 0.455
    PENALTY_K: 0.138
    LR: 0.348
    EXEMPLAR_SIZE: 127
    INSTANCE_SIZE: 255
    BASE_SIZE: 7
    CONTEXT_AMOUNT: 0.5
    OUTPUT_SIZE: 15

TRAIN:
    EPOCH: 5
    START_EPOCH: 0
    BATCH_SIZE: 8
    NUM_WORKERS: 4
    BASE_LR: 0.00015
    CLS_WEIGHT: 1.0
    LOC_WEIGHT: 1.0
    NUM_CONVS: 4
    BASE_SIZE: 7
    OUTPUT_SIZE: 15
    PRINT_FREQ: 100
    GRAD_CLIP: 10.0
    LOG_GRADS: False
    RESUME: ""
    PRETRAINED: ""
    SNAPSHOT_DIR: "/home/u20/single-object-tracking/artifacts/nanotrack_four_dataset_finetune/full"
    LR:
        TYPE: "log"
        KWARGS:
            start_lr: 0.00015
            end_lr: 0.000015
    LR_WARMUP:
        WARMUP: True
        TYPE: "step"
        EPOCH: 1
        KWARGS:
            start_lr: 0.00005
            end_lr: 0.00015
            step: 1

DATASET:
    NAMES: ["UAV123", "VISDRONE_SOT", "VISDRONE_MOT", "UAVDT"]
    VIDEOS_PER_EPOCH: 20000
    UAV123:
        ROOT: "/home/u20/single-object-tracking/data/uav123_nanotrack/crop511"
        ANNO: "/home/u20/single-object-tracking/data/uav123_nanotrack/annotations/train.json"
        FRAME_RANGE: 50
        NUM_USE: 4000
    VISDRONE_SOT:
        ROOT: "/home/u20/single-object-tracking/data/nanotrack_four_dataset/visdrone_sot/crop511"
        ANNO: "/home/u20/single-object-tracking/data/nanotrack_four_dataset/visdrone_sot/train.json"
        FRAME_RANGE: 100
        NUM_USE: 6000
    VISDRONE_MOT:
        ROOT: "/home/u20/single-object-tracking/data/nanotrack_four_dataset/visdrone_mot/crop511"
        ANNO: "/home/u20/single-object-tracking/data/nanotrack_four_dataset/visdrone_mot/train.json"
        FRAME_RANGE: 30
        NUM_USE: 6000
    UAVDT:
        ROOT: "/home/u20/single-object-tracking/data/nanotrack_four_dataset/uavdt/crop511"
        ANNO: "/home/u20/single-object-tracking/data/nanotrack_four_dataset/uavdt/train.json"
        FRAME_RANGE: 30
        NUM_USE: 4000
    TEMPLATE:
        SHIFT: 4
        SCALE: 0.05
        BLUR: 0.0
        FLIP: 0.0
        COLOR: 1.0
    SEARCH:
        SHIFT: 64
        SCALE: 0.18
        BLUR: 0.2
        FLIP: 0.0
        COLOR: 1.0
    NEG: 0.2
    GRAY: 0.0
