  memory_plateau: fail
  same_protocol_old_new_resource_comparison: incomplete
  visible_infrared_calibration: incomplete
  development_board_release_gate: held

consumption_rule: >-
  Development-board validation runs before production cross-compilation. The
  cross-compilation chat may consume only the latest coordinator-approved board
  handoff and only needs to confirm that it can obtain that exact result and
  compile it successfully. Deployment to and acceptance on the real gimbal pod
  are human-only and must never be inferred from compilation success.
